<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — e-Siber</title>
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="3;url=/">
    <link rel="canonical" href="https://e-siber.com/">
    <style>
        :root { --bg: #0b0d10; --card: #15181d; --border: #262a30; --text: #e6e6e6; --muted: #8b8d92; --accent: #5ac8fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .wrap { max-width: 560px; padding: 40px 24px; text-align: center; }
        .code { font-family: 'SF Mono', Monaco, monospace; font-size: 13px; color: var(--accent); letter-spacing: 2px; margin-bottom: 20px; }
        h1 { color: var(--text); font-size: 32px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 12px; }
        h1 span { color: var(--accent); }
        p { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
        a.home { display: inline-block; background: var(--accent); color: #0b0d10; padding: 12px 28px; border-radius: 8px; font-weight: 700; text-decoration: none; }
        a.home:hover { filter: brightness(1.1); }
        .hint { margin-top: 24px; font-size: 13px; color: #555; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">HTTP 404 / NOT_FOUND</div>
        <h1>Sayfa <span>bulunamadı.</span></h1>
        <p>The page you're looking for doesn't exist. Redirecting you to the homepage shortly.</p>
        <a class="home" href="/">Go home →</a>
        <div class="hint">Auto-redirect in 3 seconds.</div>
    </div>
    <script>setTimeout(function(){ location.replace('/'); }, 3000);</script>
</body>
</html>
